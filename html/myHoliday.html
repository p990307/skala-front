<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 휴일 일과</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-decor" aria-hidden="true">
        <span style="left:2%; top:10%;">🐰</span>
        <span style="right:2%; top:12%;">🌸</span>
        <span style="left:3%; top:32%;">🍀</span>
        <span style="right:3%; top:38%;">🦋</span>
        <span style="left:2%; top:58%;">🎈</span>
        <span style="right:2%; top:62%;">🧸</span>
        <span style="left:3%; top:84%;">⭐</span>
        <span style="right:3%; top:86%;">🍒</span>
    </div>
    <div class="container">

    <div class="page-header">
        <a href="index.html" class="back-home" aria-label="메인 페이지로 돌아가기">←</a>
        <h1>🎉 나의 휴일 일과</h1>
    </div>
    <p class="holiday-intro">마킹된 부분을 클릭하면 사진을 볼 수 있어요!</p>

    <div class="timeline reveal">

        <section class="timeline-block">
            <h2>🛏️ 아침 일과</h2>
            <ul class="timeline-list">
                <li class="timeline-item">
                    <span class="timeline-time">10:00</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc">☀️ 기상</span>
                </li>
                <li class="timeline-item">
                    <span class="timeline-time">11:00</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc has-photo">
                        🍳 <mark>아침식사</mark>
                        <span class="hover-photos">
                            <img src="media/아침식사 1.jpg" alt="아침식사 1">
                            <img src="media/아침식사 2.JPG" alt="아침식사 2">
                        </span>
                    </span>
                </li>
                <li class="timeline-item">
                    <span class="timeline-time">12:00</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc">🏸 운동하기</span>
                </li>
            </ul>
        </section>

        <section class="timeline-block">
            <h2>🚶 오후 활동</h2>
            <ul class="timeline-list">
                <li class="timeline-item">
                    <span class="timeline-time">13:00</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc">☕️ 커피타임</span>
                </li>
                <li class="timeline-item">
                    <span class="timeline-time">14:30</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc">📚 공부하기</span>
                </li>
                <li class="timeline-item">
                    <span class="timeline-time">16:00</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc has-photo">
                        ⚾️ <mark>야구장가기</mark>
                        <span class="hover-photos">
                            <img src="media/야구장1.jpg" alt="야구장 1">
                            <img src="media/야구장2.jpg" alt="야구장 2">
                        </span>
                    </span>
                </li>
            </ul>
        </section>

        <section class="timeline-block">
            <h2>🎬 저녁과 밤</h2>
            <ul class="timeline-list">
                <li class="timeline-item">
                    <span class="timeline-time">18:00</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc">🥘 맛있는 저녁 먹기</span>
                </li>
                <li class="timeline-item">
                    <span class="timeline-time">20:00</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc has-photo">
                        <mark>🎬 영화 보기</mark>
                        <span class="hover-photos">
                            <img src="media/영화.jpg" alt="영화 보기">
                        </span>
                    </span>
                </li>
                <li class="timeline-item">
                    <span class="timeline-time">23:00</span>
                    <span class="timeline-dot"></span>
                    <span class="timeline-desc">😴 쉬는타임</span>
                </li>
            </ul>
        </section>

    </div>

    <p class="holiday-footer">📅 휴일 버전 작성일: <time datetime="2026-07">2026년 7월</time></p>

    </div>
    <script src="script/dynamic.js"></script>
</body>
</html>
