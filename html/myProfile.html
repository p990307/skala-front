<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 프로필 페이지</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-decor" aria-hidden="true">
        <span style="left:2%; top:10%;">🐰</span>
        <span style="right:2%; top:12%;">🌸</span>
        <span style="left:3%; top:32%;">🍀</span>
        <span style="right:3%; top:38%;">🦋</span>
        <span style="left:2%; top:58%;">🎈</span>
        <span style="right:2%; top:62%;">🧸</span>
        <span style="left:3%; top:84%;">⭐</span>
        <span style="right:3%; top:86%;">🍒</span>
    </div>
    <div class="container">

    <div class="page-header">
        <a href="index.html" class="back-home" aria-label="메인 페이지로 돌아가기">←</a>
        <h1>👋 안녕하세요! 저를 소개합니다</h1>
    </div>

    <div class="profile-photo-wrap reveal">
        <img src="media/이효은 사진.jpg" alt="이효은 증명사진" class="profile-photo">
    </div>

    <p>아래는 제가 좋아하는 것들과 올해의 계획, 저를 표현하는 단어들, 그리고 연구 내용입니다. 카드를 클릭하면 내용이 펼쳐져요.</p>

    <section class="accordion-group reveal">

        <!-- 1. 연구 내용 -->
        <div class="accordion">
            <button type="button" class="accordion-toggle" aria-expanded="false">
                <span class="accordion-icon">📚</span>
                <span class="accordion-title">연구 내용</span>
                <span class="accordion-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="accordion-panel">
                <div class="accordion-panel-inner">
                    <h4>Publication</h4>
                    <ul class="publication-list">
                        <li>
                            <a href="https://link.springer.com/article/10.1007/s12541-025-01391-7" target="_blank" rel="noopener noreferrer" class="pub-badge">Paper</a>
                        </li>
                        <li>
                            <a href="media/이효은특허.pdf" target="_blank" rel="noopener noreferrer" class="pub-badge">Patent</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 2. 내가 좋아하는 음식 (순서 없는 리스트) -->
        <div class="accordion">
            <button type="button" class="accordion-toggle" aria-expanded="false">
                <span class="accordion-icon">🍕</span>
                <span class="accordion-title">내가 좋아하는 음식</span>
                <span class="accordion-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="accordion-panel">
                <div class="accordion-panel-inner">
                    <ul>
                        <li>뿌링클 ☕</li>
                        <li>엽기 떡볶이 🌶️</li>
                        <li>도넛 🍩</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 3. 올 해 할 일 (순서 있는 리스트) -->
        <div class="accordion">
            <button type="button" class="accordion-toggle" aria-expanded="false">
                <span class="accordion-icon">📅</span>
                <span class="accordion-title">올해 할 일</span>
                <span class="accordion-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="accordion-panel">
                <div class="accordion-panel-inner">
                    <ol>
                        <li>배드민턴 D조 우승 🥇</li>
                        <li>취업하기 💪</li>
                        <li>다이어트 성공하기 🥗</li>
                    </ol>
                </div>
            </div>
        </div>

        <!-- 4. 나를 설명하는 단어들 (정의형 목록) -->
        <div class="accordion">
            <button type="button" class="accordion-toggle" aria-expanded="false">
                <span class="accordion-icon">✨</span>
                <span class="accordion-title">나를 설명하는 단어들</span>
                <span class="accordion-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="accordion-panel">
                <div class="accordion-panel-inner">
                    <dl>
                        <dt>🏃‍♂️ 열정</dt>
                        <dd>뭐든 하나에 빠지면 끝을 봅니다.</dd>

                        <dt>☺️ 긍정적</dt>
                        <dd>항상 행복하려고 노력합니다.</dd>

                        <dt>🔥 도전적</dt>
                        <dd>새로운 도전을 두려워하지 않습니다.</dd>
                    </dl>
                </div>
            </div>
        </div>

    </section>

    </div>
    <script src="script/accordion.js"></script>
    <script src="script/dynamic.js"></script>
</body>
</html>
